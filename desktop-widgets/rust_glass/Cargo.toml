[package]
name = "liquid_glass"
version = "0.1.0"
edition = "2021"
description = "Liquid Desktop: расчёт стекла (размытие, цвет акрила, преломление у края, свет, оттенок темы) для glass.py"
license = "MIT"

[lib]
name = "liquid_glass"
crate-type = ["cdylib"]

[dependencies]
# под Python 3.12 (он же во встроенной сборке релиза)
pyo3 = { version = "0.23", features = ["extension-module"] }
numpy = "0.23"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
